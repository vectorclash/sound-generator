<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Infinite Music Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #ccc;
      font-family: 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #three-container {
      position: fixed;
      top: 0; left: 0;
      z-index: 0;
    }
    #three-container canvas {
      display: block;
    }
    #ui {
      position: relative;
      z-index: 1;
      text-align: center;
      pointer-events: none;
    }
    #start-btn {
      pointer-events: all;
      background: transparent;
      border: 1px solid #444;
      color: #888;
      font-family: inherit;
      font-size: 13px;
      padding: 10px 28px;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.3s;
    }
    #start-btn:hover { border-color: #888; color: #ccc; }
    #info {
      margin-top: 20px;
      font-size: 12px;
      letter-spacing: 1px;
      color: #555;
      line-height: 1.8;
      transition: color 1s;
      text-shadow: 0 0 12px rgba(100,140,200,0.4);
    }
    #info.active { color: #aab8cc; }
    #state-line {
      font-size: 11px;
      color: #444;
      margin-top: 10px;
      letter-spacing: 2px;
      transition: color 2s;
      text-shadow: 0 0 10px rgba(100,140,200,0.3);
    }
    #state-line.active { color: #7a8fa8; }
  </style>
</head>
<body>
  <div id="three-container"></div>
  <div id="ui">
    <button id="start-btn">PLAY</button>
    <div id="info">infinite generative music<br>shifts over time</div>
    <div id="state-line"></div>
  </div>

<script>
// ─── Audio Context ────────────────────────────────────────────────────────────
const AC = window.AudioContext || window.webkitAudioContext;
let ctx, masterGain, reverbNode, analyser, started = false;
let freqData, waveData;

// ─── Musical State ────────────────────────────────────────────────────────────
const SEMITONE = Math.pow(2, 1/12);

const SCALES = {
  aeolian:    [0,2,3,5,7,8,10],
  dorian:     [0,2,3,5,7,9,10],
  phrygian:   [0,1,3,5,7,8,10],
  minor_pent: [0,3,5,7,10],
  major_pent: [0,2,4,7,9],
  lydian:     [0,2,4,6,7,9,11],
  mixolydian: [0,2,4,5,7,9,10],
};
const SCALE_NAMES = Object.keys(SCALES);

const C2 = 65.406;
function midiToHz(midi) { return C2 * Math.pow(SEMITONE, midi - 24); }

let state = {
  rootMidi: 36,
  scaleIdx: 0,
  tempo: 88,
  density: 0.5,
  brightness: 0.3,
  spaciousness: 0.5,
  era: 0,
};

// ─── Helpers ─────────────────────────────────────────────────────────────────
function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function lerp(a, b, t) { return a + (b - a) * t; }

function scaleNotes(rootMidi, scaleIntervals, octaves = 3) {
  const notes = [];
  for (let o = 0; o < octaves; o++) {
    for (const i of scaleIntervals) {
      notes.push(rootMidi + o * 12 + i);
    }
  }
  return notes;
}

function scaleName() { return SCALE_NAMES[state.scaleIdx]; }
function rootName() {
  const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  return names[state.rootMidi % 12];
}

// ─── Reverb ───────────────────────────────────────────────────────────────────
function buildReverb(duration = 3.5, decay = 2.5) {
  const sr = ctx.sampleRate;
  const len = sr * duration;
  const buf = ctx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
  }
  const conv = ctx.createConvolver();
  conv.buffer = buf;
  return conv;
}

// ─── Scheduler ───────────────────────────────────────────────────────────────
const LOOKAHEAD = 0.12;
const INTERVAL  = 60;

function beat() { return 60 / state.tempo; }

// ─── Voice: Pad ──────────────────────────────────────────────────────────────
const padVoice = (() => {
  let nextTime = 0;

  function playChord(t) {
    const scale = SCALES[SCALE_NAMES[state.scaleIdx]];
    const root = state.rootMidi + 24;
    const degree = pick([0, 2, 4, 1, 3]);
    const chord = [0, 2, 4].map(i => {
      const idx = (degree + i) % scale.length;
      return root + scale[idx];
    });

    const dur = beat() * pick([3, 4, 6, 8]);
    const gain = rand(0.06, 0.12);

    for (const midi of chord) {
      const hz = midiToHz(midi);
      const osc = ctx.createOscillator();
      const filt = ctx.createBiquadFilter();
      const env = ctx.createGain();
      const wet = ctx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.value = hz;
      osc.detune.value = rand(-8, 8);

      filt.type = 'lowpass';
      filt.frequency.value = lerp(400, 2400, state.brightness);
      filt.Q.value = 1.2;

      env.gain.setValueAtTime(0, t);
      env.gain.linearRampToValueAtTime(gain, t + 0.8);
      env.gain.setValueAtTime(gain, t + dur - 1.0);
      env.gain.linearRampToValueAtTime(0, t + dur);

      wet.gain.value = lerp(0.2, 0.8, state.spaciousness);

      osc.connect(filt);
      filt.connect(env);
      env.connect(masterGain);
      env.connect(wet);
      wet.connect(reverbNode);

      osc.start(t);
      osc.stop(t + dur + 0.1);
    }

    return dur - 0.5;
  }

  return {
    tick(now) {
      while (nextTime < now + LOOKAHEAD) {
        if (nextTime === 0) nextTime = now;
        const dur = playChord(nextTime);
        nextTime += dur;
      }
    },
    reset(now) { nextTime = now; }
  };
})();

// ─── Voice: Bass ─────────────────────────────────────────────────────────────
const bassVoice = (() => {
  let nextTime = 0;

  function playNote(t) {
    const scale = SCALES[SCALE_NAMES[state.scaleIdx]];
    const choices = [0, scale[4], scale[2]];
    const interval = pick(choices);
    const midi = state.rootMidi + interval;
    const hz = midiToHz(midi);

    const noteDur = beat() * pick([1, 2, 2, 3]);
    const attackDur = 0.04;
    const gain = rand(0.18, 0.26);

    const osc = ctx.createOscillator();
    const sub = ctx.createOscillator();
    const env = ctx.createGain();
    const filt = ctx.createBiquadFilter();

    osc.type = 'triangle';
    osc.frequency.value = hz;
    sub.type = 'sine';
    sub.frequency.value = hz * 0.5;

    filt.type = 'lowpass';
    filt.frequency.value = 280;

    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(gain, t + attackDur);
    env.gain.exponentialRampToValueAtTime(0.001, t + noteDur * 0.85);

    osc.connect(filt); sub.connect(filt);
    filt.connect(env);
    env.connect(masterGain);

    osc.start(t); osc.stop(t + noteDur);
    sub.start(t); sub.stop(t + noteDur);

    return noteDur;
  }

  return {
    tick(now) {
      while (nextTime < now + LOOKAHEAD) {
        if (nextTime === 0) nextTime = now;
        const dur = playNote(nextTime);
        nextTime += dur;
      }
    },
    reset(now) { nextTime = now; }
  };
})();

// ─── Voice: Melody ───────────────────────────────────────────────────────────
const melodyVoice = (() => {
  let nextTime = 0;
  let lastMidi = -1;

  function playNote(t) {
    if (Math.random() < 0.25) {
      return beat() * pick([0.5, 1, 1]);
    }

    const scale = SCALES[SCALE_NAMES[state.scaleIdx]];
    const notes = scaleNotes(state.rootMidi + 36, scale, 2);

    let midi;
    if (lastMidi > 0 && Math.random() < 0.65) {
      const idx = notes.indexOf(lastMidi);
      if (idx >= 0) {
        const step = Math.random() < 0.5 ? 1 : -1;
        midi = notes[Math.max(0, Math.min(notes.length - 1, idx + step))];
      }
    }
    if (!midi) midi = pick(notes);
    lastMidi = midi;

    const hz = midiToHz(midi);
    const noteDur = beat() * pick([0.5, 0.5, 1, 1, 1.5, 2]);
    const gain = rand(0.07, 0.14) * lerp(0.4, 1.0, state.density);

    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    const wet = ctx.createGain();

    osc.type = Math.random() < 0.5 ? 'sine' : 'triangle';
    osc.frequency.value = hz;
    osc.detune.value = rand(-4, 4);

    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(gain, t + 0.02);
    env.gain.exponentialRampToValueAtTime(0.001, t + noteDur * 0.88);

    wet.gain.value = 0.6;

    osc.connect(env);
    env.connect(masterGain);
    env.connect(wet);
    wet.connect(reverbNode);

    osc.start(t); osc.stop(t + noteDur + 0.05);
    return noteDur;
  }

  return {
    tick(now) {
      while (nextTime < now + LOOKAHEAD) {
        if (nextTime === 0) nextTime = now;
        const dur = playNote(nextTime);
        nextTime += dur;
      }
    },
    reset(now) { nextTime = now; }
  };
})();

// ─── Voice: Texture ───────────────────────────────────────────────────────────
const textureVoice = (() => {
  let nextTime = 0;

  function playNote(t) {
    const wait = beat() * rand(1, 4);
    if (Math.random() < 0.4) return wait;

    const scale = SCALES[SCALE_NAMES[state.scaleIdx]];
    const notes = scaleNotes(state.rootMidi + 48, scale, 2);
    const midi = pick(notes);
    const hz = midiToHz(midi);

    const gain = rand(0.03, 0.07);
    const dur = rand(1.5, 4.0);

    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    const wet = ctx.createGain();

    osc.type = 'sine';
    osc.frequency.value = hz;

    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(gain, t + 0.15);
    env.gain.exponentialRampToValueAtTime(0.001, t + dur);

    wet.gain.value = 0.9;

    osc.connect(env);
    env.connect(wet);
    wet.connect(reverbNode);

    osc.start(t); osc.stop(t + dur + 0.1);
    return wait;
  }

  return {
    tick(now) {
      while (nextTime < now + LOOKAHEAD) {
        if (nextTime === 0) nextTime = now;
        const dur = playNote(nextTime);
        nextTime += dur;
      }
    },
    reset(now) { nextTime = now; }
  };
})();

// ─── Evolution Engine ─────────────────────────────────────────────────────────
let eraTimer = 0;
const ERA_DURATION = 38;

function evolve(dt) {
  eraTimer += dt;
  if (eraTimer >= ERA_DURATION) {
    eraTimer -= ERA_DURATION;
    advanceEra();
  }

  state.brightness += (Math.random() - 0.5) * 0.002;
  state.brightness = Math.max(0.05, Math.min(0.95, state.brightness));
  state.density += (Math.random() - 0.5) * 0.001;
  state.density = Math.max(0.1, Math.min(1.0, state.density));
  state.spaciousness += (Math.random() - 0.5) * 0.001;
  state.spaciousness = Math.max(0.1, Math.min(0.9, state.spaciousness));

  updateStateDisplay();
}

function advanceEra() {
  state.era++;
  const shifts = [-7, -5, -2, 0, 0, 2, 5, 7];
  state.rootMidi = Math.max(24, Math.min(48, state.rootMidi + pick(shifts)));
  state.scaleIdx = Math.floor(Math.random() * SCALE_NAMES.length);
  state.tempo = Math.max(52, Math.min(130, state.tempo + rand(-8, 8)));
  state.brightness = rand(0.1, 0.9);
  state.spaciousness = rand(0.2, 0.85);
  state.density = rand(0.2, 0.9);
}

// ─── Tick ─────────────────────────────────────────────────────────────────────
let lastTickTime = 0;

function tick() {
  if (!started) return;
  const now = ctx.currentTime;
  const dt = now - (lastTickTime || now);
  lastTickTime = now;

  padVoice.tick(now);
  bassVoice.tick(now);
  melodyVoice.tick(now);
  textureVoice.tick(now);
  evolve(dt);
}

// ─── Three.js Scene ───────────────────────────────────────────────────────────
const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });

renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a0a0f);
document.getElementById('three-container').appendChild(renderer.domElement);
const clock = new THREE.Clock();

scene.fog = new THREE.FogExp2(0x0a0a0f, 0.022);

camera.position.set(0, 1.5, 7);
camera.lookAt(0, 0, 0);

// Wireframe icosahedron (deforms with audio)
const icoGeo = new THREE.IcosahedronGeometry(1.5, 5);
const icoOrigPos = icoGeo.attributes.position.array.slice();
const icoMat = new THREE.MeshBasicMaterial({
  color: 0x334466,
  wireframe: true,
  transparent: true,
  opacity: 0.75,
});
const icoMesh = new THREE.Mesh(icoGeo, icoMat);
scene.add(icoMesh);

// Inner glow sphere (additive blend)
const glowGeo = new THREE.SphereGeometry(1.0, 32, 32);
const glowMat = new THREE.MeshBasicMaterial({
  color: 0x112244,
  transparent: true,
  opacity: 0.35,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
const glowMesh = new THREE.Mesh(glowGeo, glowMat);
scene.add(glowMesh);

// Frequency bars — ring of 64 vertical pillars
const BAR_COUNT  = 64;
const RING_RADIUS = 3.2;
const freqBars = [];
for (let i = 0; i < BAR_COUNT; i++) {
  const angle = (i / BAR_COUNT) * Math.PI * 2;
  const bGeo = new THREE.BoxGeometry(0.1, 1, 0.1);
  bGeo.translate(0, 0.5, 0); // pivot at bottom edge
  const bMat = new THREE.MeshBasicMaterial({
    color: 0x446699,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const bar = new THREE.Mesh(bGeo, bMat);
  bar.position.set(
    Math.cos(angle) * RING_RADIUS,
    -0.4,
    Math.sin(angle) * RING_RADIUS
  );
  bar.userData.angle = angle;
  scene.add(bar);
  freqBars.push(bar);
}

// Star field — cylindrical coords stored for torsional motion
const STAR_COUNT = 5000;
const starPos = new Float32Array(STAR_COUNT * 3);  // live XYZ (updated each frame)
const starCyl = new Float32Array(STAR_COUNT * 5);  // [rCyl, baseAngle, yBase, phase, speed]
for (let i = 0; i < STAR_COUNT; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.acos(2 * Math.random() - 1);
  const r     = 15 + Math.random() * 80;
  const x     = r * Math.sin(phi) * Math.cos(theta);
  const y     = r * Math.sin(phi) * Math.sin(theta);
  const z     = r * Math.cos(phi);

  starCyl[i * 5]     = Math.sqrt(x * x + z * z);  // cylindrical radius
  starCyl[i * 5 + 1] = Math.atan2(z, x);           // base angle
  starCyl[i * 5 + 2] = y;                           // height
  starCyl[i * 5 + 3] = Math.random() * Math.PI * 2; // personal phase
  starCyl[i * 5 + 4] = 0.4 + Math.random() * 1.2;  // personal speed

  starPos[i * 3]     = x;
  starPos[i * 3 + 1] = y;
  starPos[i * 3 + 2] = z;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({
  size: 0.1,
  color: 0x8899bb,
  transparent: true,
  opacity: 0.55,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true,
});
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Animate ─────────────────────────────────────────────────────────────────
let cameraAngle = 0;
const _col = new THREE.Color();

function animate() {
  requestAnimationFrame(animate);

  if (!started || !analyser) {
    // Idle: gentle slow spin
    icoMesh.rotation.y += 0.004;
    icoMesh.rotation.x += 0.001;
    cameraAngle += 0.003;
    camera.position.set(
      Math.sin(cameraAngle) * 7,
      1.5,
      Math.cos(cameraAngle) * 7
    );
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
    return;
  }

  analyser.getByteFrequencyData(freqData);

  // Energy metrics
  let energy = 0;
  for (let i = 0; i < freqData.length; i++) energy += freqData[i];
  energy /= freqData.length * 255;

  let bass = 0;
  for (let i = 0; i < 8; i++) bass += freqData[i];
  bass /= 8 * 255;

  // Hue derived from musical state
  const hue = (state.rootMidi * 15 + state.era * 40) % 360;

  // ── Icosahedron vertex deformation ──────────────────────────────────────────
  const pos = icoMesh.geometry.attributes.position.array;
  for (let i = 0; i < pos.length; i += 3) {
    const ox = icoOrigPos[i], oy = icoOrigPos[i + 1], oz = icoOrigPos[i + 2];
    const len = Math.sqrt(ox * ox + oy * oy + oz * oz);
    const nx = ox / len, ny = oy / len, nz = oz / len;

    const t = Math.abs(Math.atan2(nz, nx) / Math.PI) * 0.5 + Math.abs(ny) * 0.5;
    const bin = Math.floor(t * freqData.length * 0.75);
    const freq = freqData[bin] / 255;

    const disp = 1.5 + freq * 1.1 + bass * 0.5;
    pos[i]     = nx * disp;
    pos[i + 1] = ny * disp;
    pos[i + 2] = nz * disp;
  }
  icoMesh.geometry.attributes.position.needsUpdate = true;
  icoMesh.geometry.computeVertexNormals();

  _col.setHSL(hue / 360, 0.65, 0.55);
  icoMat.color.copy(_col);
  icoMesh.rotation.y += 0.003 + energy * 0.006;
  icoMesh.rotation.x += 0.001 + energy * 0.002;

  // ── Inner glow ───────────────────────────────────────────────────────────────
  _col.setHSL(hue / 360, 0.85, 0.25);
  glowMat.color.copy(_col);
  glowMat.opacity = 0.15 + bass * 0.65;
  const gs = 1.0 + bass * 0.6;
  glowMesh.scale.setScalar(gs);

  // ── Frequency bars ───────────────────────────────────────────────────────────
  for (let i = 0; i < freqBars.length; i++) {
    const val = freqData[Math.floor(i * freqData.length / freqBars.length)] / 255;
    freqBars[i].scale.y = 0.04 + val * 3.5;
    const bh = ((hue + i * (360 / BAR_COUNT)) % 360) / 360;
    _col.setHSL(bh, 0.85, 0.35 + val * 0.45);
    freqBars[i].material.color.copy(_col);
    freqBars[i].material.opacity = 0.25 + val * 0.75;
  }

  // ── Stars — torsional motion ──────────────────────────────────────────────────
  const t = clock.getElapsedTime();
  // Two overlapping sine waves give an oscillating twist that never locks in
  const twistAmt = Math.sin(t * 0.11) * 1.8 + Math.sin(t * 0.07) * 0.9;
  const twistDynamic = twistAmt * (1 + energy * 1.5 + bass * 4.0);

  for (let i = 0; i < STAR_COUNT; i++) {
    const rCyl    = starCyl[i * 5];
    const baseAng = starCyl[i * 5 + 1];
    const yBase   = starCyl[i * 5 + 2];
    const phase   = starCyl[i * 5 + 3];
    const spd     = starCyl[i * 5 + 4];

    // Height-dependent twist: top and bottom shear in opposite directions
    const heightNorm  = yBase / 55;
    const angle = baseAng
      + twistDynamic * heightNorm * spd        // torsional shear
      + t * 0.04 * spd;                        // slow base drift

    // Radial breathing + bass-driven expansion
    const breathe = 1.0 + Math.sin(t * 0.35 + phase) * 0.04;
    const expand  = 1.0 + bass * 0.18 + energy * 0.06;
    const r = rCyl * breathe * expand;

    // Gentle vertical pumping that scales with energy
    const yOff = Math.sin(t * 0.28 + phase + 1.3) * (1.2 + energy * 4.0);

    starPos[i * 3]     = Math.cos(angle) * r;
    starPos[i * 3 + 1] = yBase + yOff;
    starPos[i * 3 + 2] = Math.sin(angle) * r;
  }
  starGeo.attributes.position.needsUpdate = true;

  _col.setHSL(hue / 360, 0.4, 0.6);
  starMat.color.copy(_col);

  // ── Camera orbit ─────────────────────────────────────────────────────────────
  cameraAngle += 0.0035 + energy * 0.0018;
  camera.position.set(
    Math.sin(cameraAngle) * 7.5,
    Math.sin(cameraAngle * 0.37) * 2.2 + 1.0,
    Math.cos(cameraAngle) * 7.5
  );
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}

animate();

// ─── State Display ────────────────────────────────────────────────────────────
const stateEl = document.getElementById('state-line');
const infoEl  = document.getElementById('info');

function updateStateDisplay() {
  const prog = Math.round((eraTimer / ERA_DURATION) * 100);
  stateEl.textContent = `${rootName()} ${scaleName()}  ·  ${Math.round(state.tempo)} bpm  ·  era ${state.era}  [${prog}%]`;
}

// ─── Start ────────────────────────────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', async () => {
  if (started) return;

  ctx = new AC();
  masterGain = ctx.createGain();
  masterGain.gain.value = 0.55;

  analyser = ctx.createAnalyser();
  analyser.fftSize = 512;
  freqData = new Uint8Array(analyser.frequencyBinCount);
  waveData = new Uint8Array(analyser.fftSize);

  reverbNode = buildReverb(4, 2.8);
  const reverbGain = ctx.createGain();
  reverbGain.gain.value = 0.45;

  masterGain.connect(analyser);
  analyser.connect(ctx.destination);
  reverbNode.connect(reverbGain);
  reverbGain.connect(analyser);

  started = true;
  document.getElementById('start-btn').style.display = 'none';
  infoEl.classList.add('active');
  stateEl.classList.add('active');

  state.scaleIdx = 0;
  state.rootMidi = 36;
  state.tempo = 78;

  setInterval(tick, INTERVAL);
});
