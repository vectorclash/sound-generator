<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Infinite Music Generator</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #ccc;
      font-family: 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #three-container {
      position: fixed;
      top: 0; left: 0;
      z-index: 0;
    }
    #three-container canvas { display: block; }

    /* ─── Root UI wrapper ──────────────────────────────────────────────────── */
    #ui {
      position: relative;
      z-index: 1;
      text-align: center;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* ─── Mode tabs ───────────────────────────────────────────────────────── */
    #mode-tabs {
      pointer-events: all;
      display: flex;
      border: 1px solid #4a5a6a;
    }
    .mode-tab {
      background: transparent;
      border: none;
      border-right: 1px solid #4a5a6a;
      color: #7a8a9a;
      font-family: inherit;
      font-size: 11px;
      padding: 8px 22px;
      cursor: pointer;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: color 0.2s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .mode-tab:last-child { border-right: none; }
    .mode-tab:hover { color: #aabece; }
    .mode-tab.active { color: #d0dde8; background: rgba(100,140,200,0.12); }

    /* ─── Infinite mode UI ────────────────────────────────────────────────── */
    #start-btn {
      pointer-events: all;
      background: transparent;
      border: 1px solid #555;
      color: #999;
      font-family: inherit;
      font-size: clamp(18px, 5vw, 28px);
      padding: clamp(16px, 4vw, 22px) clamp(40px, 10vw, 72px);
      cursor: pointer;
      letter-spacing: 4px;
      text-transform: uppercase;
      transition: all 0.3s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #start-btn:hover           { border-color: #aaa; color: #eee; }
    #start-btn:active          { border-color: #ccc; color: #fff; }
    #start-btn.playing         { border-color: #556; color: #778; }
    #start-btn.playing:hover   { border-color: #99aacc; color: #bbccdd; }
    #info {
      font-size: 16px;
      letter-spacing: 2px;
      color: #778899;
      line-height: 1.8;
      transition: color 1s;
      text-shadow: 0 0 18px rgba(100,140,200,0.6);
    }
    #info.active { color: #ccd8e8; }
    #state-line {
      font-size: 14px;
      color: #556677;
      letter-spacing: 2px;
      transition: color 2s;
      text-shadow: 0 0 14px rgba(100,140,200,0.5);
      white-space: pre-line;
      line-height: 1.8;
    }
    #state-line.active { color: #99b0c8; }

    /* ─── Collapsible sections ──────────────────────────────────────────────── */
    .collapsible-section {
      border-top: 1px solid #1e2a3a;
      padding-top: 10px;
    }
    .collapsible-section:first-child { border-top: none; padding-top: 0; }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding-bottom: 10px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .section-header .section-label { margin-bottom: 0; }
    .section-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-chevron {
      font-size: 8px;
      color: #4a6a80;
      transition: transform 0.22s;
      flex-shrink: 0;
    }
    .collapsible-section.collapsed .section-chevron { transform: rotate(-90deg); }
    .section-body {
      overflow: hidden;
      max-height: 1000px;
      opacity: 1;
      transition: max-height 0.3s ease, opacity 0.2s;
    }
    .collapsible-section.collapsed .section-body {
      max-height: 0;
      opacity: 0;
    }

    /* ─── Section label row (with inline clear button) ─────────────────────── */
    .clear-btn {
      background: transparent;
      border: 1px solid #3a4a5a;
      color: #6a7a8a;
      font-family: inherit;
      font-size: 9px;
      padding: 4px 10px;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: border-color 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .clear-btn:hover { border-color: #6a8aaa; color: #aabece; }

    /* ─── Manual panel ────────────────────────────────────────────────────── */
    #manual-ui {
      display: none;
      pointer-events: all;
      width: min(500px, 92vw);
      max-height: 72vh;
      overflow-y: auto;
      background: rgba(4, 5, 10, 0.8);
      border: 1px solid #4a5a6a;
      padding: clamp(14px, 3.5vw, 26px);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #3a4a5a transparent;
      scrollbar-gutter: stable both-edges;
    }
    #manual-ui.active { display: block; }
    #manual-ui::-webkit-scrollbar { width: 3px; }
    #manual-ui::-webkit-scrollbar-thumb { background: #3a4a5a; }

    /* control rows */
    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .ctrl-label {
      font-size: 10px;
      letter-spacing: 3px;
      color: #8899aa;
      min-width: 58px;
      text-align: right;
      flex-shrink: 0;
    }
    .ctrl-unit {
      font-size: 10px;
      letter-spacing: 3px;
      color: #8899aa;
      flex-shrink: 0;
    }
    .ctrl-value {
      font-size: 12px;
      color: #aabece;
      min-width: 3ch;
    }

    /* ─── BPM slider ─────────────────────────────────────────────────────────── */
    #manual-bpm-slider {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 40px;
      background: transparent;
      outline: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #manual-bpm-slider::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: #4a6a80;
    }
    #manual-bpm-slider::-moz-range-track {
      height: 4px;
      border-radius: 2px;
      background: #4a6a80;
    }
    #manual-bpm-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: clamp(26px, 6vw, 34px);
      height: clamp(26px, 6vw, 34px);
      border-radius: 50%;
      background: #8aafc8;
      cursor: pointer;
      margin-top: -13px;
    }
    #manual-bpm-slider::-moz-range-thumb {
      width: clamp(26px, 6vw, 34px);
      height: clamp(26px, 6vw, 34px);
      border-radius: 50%;
      background: #8aafc8;
      cursor: pointer;
      border: none;
    }


    /* instruments */
    .section-label {
      font-size: 9px;
      letter-spacing: 4px;
      color: #6a7a8a;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    #voice-groups {
      margin-bottom: 22px;
    }

    /* bass / drums subtype rows */
    .voice-group {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
    }
    .group-label {
      font-size: 9px;
      letter-spacing: 3px;
      color: #6a7a8a;
      text-transform: uppercase;
      min-width: 46px;
      text-align: right;
      flex-shrink: 0;
    }
    .subtype-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
    }

    /* divider between groups and grid */
    .voices-divider {
      border-top: 1px solid #2a3040;
      margin: 12px 0;
    }

    /* simple voices grid */
    .inst-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px 6px;
    }

    /* shared toggle style */
    .inst-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .inst-toggle input[type="checkbox"] {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border: 1px solid #5a6a7a;
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
    }
    .inst-toggle input[type="checkbox"]:checked {
      background: #7a9fc0;
      border-color: #7a9fc0;
    }
    .inst-toggle input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 2px;
      top: -1px;
      width: 5px;
      height: 8px;
      border: 2px solid #0a0a0f;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }
    .inst-name {
      font-size: 9px;
      letter-spacing: 2px;
      color: #7a8a9a;
      text-transform: uppercase;
    }
    .inst-toggle input:checked ~ .inst-name { color: #aabece; }

    /* action buttons */
    #manual-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .action-btn {
      flex: 1;
      background: transparent;
      border: 1px solid #4a5a6a;
      color: #8899aa;
      font-family: inherit;
      font-size: 11px;
      padding: 11px 8px;
      cursor: pointer;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: border-color 0.2s, color 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .action-btn:hover:not(:disabled) { border-color: #8899aa; color: #d0dde8; }
    .action-btn.playing { border-color: #7a8fa8; color: #aabbc8; }
    .action-btn.recording { border-color: #8a6a6a; color: #c8a8a8; cursor: default; }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* genre preset buttons */
    .genre-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex: 1;
    }
    .genre-btn {
      background: transparent;
      border: 1px solid #3a4a5a;
      color: #6a7a8a;
      font-family: inherit;
      font-size: 9px;
      padding: 5px 11px;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .genre-btn:hover { border-color: #6a8aaa; color: #aabece; }
    .genre-btn.active { border-color: #7a9fc0; color: #ccdde8; background: rgba(100,150,200,0.1); }
    .random-genre-btn { border-style: dashed; }

    /* root / scale dropdowns */
    .ctrl-select {
      background: rgba(255,255,255,0.04);
      border: 1px solid #4a5a6a;
      color: #aabece;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 1px;
      padding: 5px 6px;
      outline: none;
      cursor: pointer;
    }
    .ctrl-select option { background: #0a0a18; color: #aabece; }
    #manual-root  { width: 56px; }
    #manual-scale { flex: 1; }

    /* ─── Feel sliders (density / tone / space / length) ────────────────────── */
    .feel-slider {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 32px;
      background: transparent;
      outline: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .feel-slider::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: #4a6a80;
    }
    .feel-slider::-moz-range-track {
      height: 4px;
      border-radius: 2px;
      background: #4a6a80;
    }
    .feel-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #8aafc8;
      cursor: pointer;
      margin-top: -9px;
    }
    .feel-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #8aafc8;
      cursor: pointer;
      border: none;
    }

    /* ─── Export countdown + progress ──────────────────────────────────────────── */
    #export-countdown {
      font-size: clamp(38px, 10vw, 54px);
      letter-spacing: 8px;
      color: #8aafc8;
      text-align: center;
      height: 0;
      line-height: 64px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.15s, height 0.15s;
      pointer-events: none;
    }
    #export-countdown.active { height: 64px; opacity: 1; }
    @keyframes countpulse {
      0%   { opacity: 0; transform: scale(1.18); }
      18%  { opacity: 1; transform: scale(1.00); }
      82%  { opacity: 1; transform: scale(1.00); }
      100% { opacity: 0.25; transform: scale(0.96); }
    }
    #export-countdown.pulse { animation: countpulse 0.92s ease-out forwards; }

    #export-progress-wrap {
      height: 2px;
      background: rgba(100,140,200,0.08);
      margin: 6px 0 12px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #export-progress-wrap.active { opacity: 1; }
    #export-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3a5a78, #8aafc8);
      transition: width 0.7s linear;
    }

    #manual-status {
      font-size: 10px;
      letter-spacing: 2px;
      color: #5a6a7a;
      text-align: center;
      min-height: 14px;
      transition: color 0.5s;
    }
    #manual-status.active { color: #aabece; }

    /* ─── Mobile overrides ──────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      #manual-ui {
        max-height: calc(100dvh - 80px);
      }

      /* bigger mode tab tap targets */
      .mode-tab {
        font-size: 12px;
        padding: 12px 18px;
        letter-spacing: 2px;
      }

      /* readable labels */
      .ctrl-label  { font-size: 11px; letter-spacing: 2px; }
      .section-label { font-size: 11px; letter-spacing: 2px; }
      .group-label { font-size: 11px; letter-spacing: 2px; }
      .ctrl-unit   { font-size: 11px; }

      /* section headers: bigger tap target */
      .section-header { padding-top: 4px; padding-bottom: 12px; }
      .section-chevron { font-size: 10px; }

      /* genre buttons: bigger tap area + font */
      .genre-btn {
        font-size: 11px;
        padding: 9px 14px;
        letter-spacing: 1.5px;
      }

      /* clear button: bigger tap area */
      .clear-btn {
        font-size: 11px;
        padding: 8px 14px;
        letter-spacing: 1.5px;
      }

      /* action buttons */
      .action-btn {
        font-size: 13px;
        padding: 14px 8px;
      }

      /* instrument grid: 2 columns so labels aren't cramped */
      .inst-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px 8px;
      }

      /* checkboxes: larger visual + extended tap target via padding */
      .inst-toggle {
        padding: 7px 4px;
        gap: 10px;
      }
      .inst-toggle input[type="checkbox"] {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .inst-toggle input[type="checkbox"]:checked::after {
        left: 3px;
        top: 0px;
        width: 7px;
        height: 11px;
      }
      .inst-name {
        font-size: 11px;
        letter-spacing: 1.5px;
      }
    }
  </style>
</head>
<body>
  <div id="three-container"></div>
  <div id="ui">

    <!-- Mode tabs -->
    <div id="mode-tabs">
      <button class="mode-tab active" data-mode="infinite">INFINITE</button>
      <button class="mode-tab" data-mode="manual">MANUAL</button>
    </div>

    <!-- Infinite mode -->
    <div id="infinite-ui">
      <button id="start-btn">PLAY</button>
      <div id="info">infinite generative music<br>shifts over time</div>
      <div id="state-line"></div>
    </div>

    <!-- Manual mode -->
    <div id="manual-ui">

      <!-- Genre presets (collapsed by default) -->
      <div class="collapsible-section collapsed" id="section-genre">
        <div class="section-header">
          <span class="section-label">GENRE</span>
          <span class="section-chevron">&#9662;</span>
        </div>
        <div class="section-body">
          <div class="ctrl-row" style="margin-bottom:12px">
            <div id="genre-btns" class="genre-row"></div>
          </div>
        </div>
      </div>

      <!-- Feel: key, scale, BPM, sliders -->
      <div class="collapsible-section" id="section-feel">
        <div class="section-header">
          <span class="section-label">FEEL</span>
          <span class="section-chevron">&#9662;</span>
        </div>
        <div class="section-body">
          <div class="ctrl-row">
            <span class="ctrl-label">ROOT</span>
            <select id="manual-root" class="ctrl-select"></select>
            <span class="ctrl-label" style="min-width:auto;padding:0 4px">SCALE</span>
            <select id="manual-scale" class="ctrl-select"></select>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">BPM</span>
            <input id="manual-bpm-slider" type="range" min="40" max="160" step="1" value="90">
            <span id="manual-bpm-value" class="ctrl-value">90</span>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">DENSITY</span>
            <input type="range" class="feel-slider" id="density-slider" min="0" max="1" step="0.01" value="0.60">
            <span class="ctrl-value" id="density-val">0.60</span>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">TONE</span>
            <input type="range" class="feel-slider" id="bright-slider" min="0" max="1" step="0.01" value="0.50">
            <span class="ctrl-value" id="bright-val">0.50</span>
          </div>
          <div class="ctrl-row" style="margin-bottom:4px">
            <span class="ctrl-label">SPACE</span>
            <input type="range" class="feel-slider" id="space-slider" min="0" max="1" step="0.01" value="0.50">
            <span class="ctrl-value" id="space-val">0.50</span>
          </div>
        </div>
      </div>

      <!-- Instruments -->
      <div class="collapsible-section" id="section-instruments">
        <div class="section-header">
          <span class="section-label">INSTRUMENTS</span>
          <div class="section-header-right">
            <button class="clear-btn" id="clear-instruments-btn">CLEAR</button>
            <span class="section-chevron">&#9662;</span>
          </div>
        </div>
        <div class="section-body">
          <div id="voice-groups"></div>
        </div>
      </div>

      <div class="ctrl-row" style="margin-top:14px">
        <span class="ctrl-label">LENGTH</span>
        <input type="range" class="feel-slider" id="manual-length" min="5" max="300" step="5" value="10">
        <span class="ctrl-value" id="manual-length-value">10s</span>
      </div>

      <div id="manual-actions">
        <button class="action-btn" id="manual-play-btn" disabled>PLAY</button>
        <button class="action-btn" id="manual-export-btn" disabled>EXPORT</button>
        <button class="action-btn" id="manual-share-btn">SHARE</button>
      </div>
      <div id="export-countdown"></div>
      <div id="export-progress-wrap"><div id="export-progress-bar"></div></div>
      <div id="manual-status"></div>
    </div>

  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
