<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Infinite Music Generator</title>
  <!-- Three.js via ES module importmap — no bundler required -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #ccc;
      font-family: 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #three-container {
      position: fixed;
      top: 0; left: 0;
      z-index: 0;
    }
    #three-container canvas { display: block; }
    #ui {
      position: relative;
      z-index: 1;
      text-align: center;
      pointer-events: none;
    }
    #start-btn {
      pointer-events: all;
      background: transparent;
      border: 1px solid #555;
      color: #999;
      font-family: inherit;
      font-size: clamp(18px, 5vw, 28px);
      padding: clamp(16px, 4vw, 22px) clamp(40px, 10vw, 72px);
      cursor: pointer;
      letter-spacing: 4px;
      text-transform: uppercase;
      transition: all 0.3s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #start-btn:hover  { border-color: #aaa; color: #eee; }
    #start-btn:active { border-color: #ccc; color: #fff; }
    #info {
      margin-top: 20px;
      font-size: 16px;
      letter-spacing: 2px;
      color: #778899;
      line-height: 1.8;
      transition: color 1s;
      text-shadow: 0 0 18px rgba(100,140,200,0.6);
    }
    #info.active { color: #ccd8e8; }
    #state-line {
      font-size: 14px;
      color: #556677;
      margin-top: 12px;
      letter-spacing: 2px;
      transition: color 2s;
      text-shadow: 0 0 14px rgba(100,140,200,0.5);
      white-space: pre-line;
      line-height: 1.8;
    }
    #state-line.active { color: #99b0c8; }
    #bpm-control {
      pointer-events: all;
      margin-top: 22px;
      display: none;
      align-items: center;
      gap: 14px;
      font-size: 13px;
      letter-spacing: 2px;
      color: #555;
    }
    #bpm-control.active { display: flex; color: #7a8fa8; }
    #bpm-slider {
      -webkit-appearance: none;
      appearance: none;
      width: clamp(180px, 40vw, 280px);
      height: 4px;
      background: #333;
      outline: none;
      cursor: pointer;
      padding: 16px 0;
      background-clip: content-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #bpm-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: clamp(28px, 6vw, 36px);
      height: clamp(28px, 6vw, 36px);
      border-radius: 50%;
      background: #7a8fa8;
      cursor: pointer;
    }
    #bpm-slider::-moz-range-thumb {
      width: clamp(28px, 6vw, 36px);
      height: clamp(28px, 6vw, 36px);
      border-radius: 50%;
      background: #7a8fa8;
      cursor: pointer;
      border: none;
    }
    #bpm-value { min-width: 3ch; text-align: left; }
  </style>
</head>
<body>
  <div id="three-container"></div>
  <div id="ui">
    <button id="start-btn">PLAY</button>
    <div id="info">infinite generative music<br>shifts over time</div>
    <div id="state-line"></div>
    <div id="bpm-control">
      <span>BPM</span>
      <input id="bpm-slider" type="range" min="40" max="160" step="1" value="78">
      <span id="bpm-value">78</span>
    </div>
  </div>

  <!-- Entry point — type="module" enables ES module imports -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
